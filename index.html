<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mio sito</title>
    <style>
        :root {
            --sand: #cbb58f;
            --black: #080808;
            --brown: #4c3525;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--sand);
            color: var(--black);
            font-family: Arial, Helvetica, sans-serif;
        }

        .menu-button {
            position: fixed;
            top: 46px;
            right: 82px;
            z-index: 20;
            width: 108px;
            height: 64px;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        .menu-button span {
            display: block;
            width: 108px;
            height: 6px;
            margin: 0 0 20px;
            border-radius: 10px;
            background: var(--black);
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .menu-button span:last-child {
            margin-bottom: 0;
        }

        .menu-button.is-open span:first-child {
            transform: translateY(26px) rotate(45deg);
        }

        .menu-button.is-open span:nth-child(2) {
            opacity: 0;
        }

        .menu-button.is-open span:last-child {
            transform: translateY(-26px) rotate(-45deg);
        }

        .menu-panel {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            width: min(360px, 100%);
            height: 100vh;
            padding: 120px 40px 40px;
            background: rgba(76, 53, 37, 0.98);
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .menu-panel.is-open {
            transform: translateX(0);
        }

        .menu-panel ul {
            width: 100%;
            list-style: none;
        }

        .menu-panel li {
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .menu-panel a {
            display: block;
            padding: 18px 0;
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
        }

        .menu-panel a:hover {
            color: var(--sand);
        }

        .page {
            min-height: 100vh;
            padding: 192px 40px 110px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 294px);
            gap: 16px 56px;
            width: max-content;
            max-width: 100%;
            margin: 0 auto;
        }

        .category {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            padding: 24px;
            color: var(--black);
            text-decoration: none;
            border: 3px solid var(--black);
            transition: color 0.25s ease, background-color 0.25s ease;
        }

        .category h2 {
            font-size: 2.8rem;
            line-height: 1;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .category:hover {
            color: var(--sand);
            background: var(--brown);
        }

        .category:focus-visible,
        .menu-button:focus-visible,
        .menu-panel a:focus-visible {
            outline: 4px solid white;
            outline-offset: 5px;
        }

        @media (max-width: 1100px) {
            .menu-button {
                top: 30px;
                right: 35px;
            }

            .page {
                padding-top: 145px;
            }

            .category-grid {
                grid-template-columns: repeat(2, 294px);
            }
        }

        @media (max-width: 680px) {
            .menu-button {
                top: 24px;
                right: 24px;
                width: 48px;
                height: 38px;
            }

            .menu-button span {
                width: 48px;
                height: 4px;
                margin-bottom: 13px;
            }

            .menu-button.is-open span:first-child {
                transform: translateY(17px) rotate(45deg);
            }

            .menu-button.is-open span:last-child {
                transform: translateY(-17px) rotate(-45deg);
            }

            .page {
                padding: 105px 20px 60px;
            }

            .category-grid {
                grid-template-columns: minmax(0, 294px);
                width: 100%;
                justify-content: center;
                gap: 28px;
            }

            .category h2 {
                font-size: 2.35rem;
            }
        }
    </style>
</head>
<body>
    <button class="menu-button" aria-label="Apri il menu" aria-expanded="false" aria-controls="menu-panel">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="menu-panel" class="menu-panel" aria-label="Menu principale">
        <ul>
            <li><a href="cinema.html">Cinema</a></li>
            <li><a href="letteratura.html">Letteratura</a></li>
            <li><a href="musica.html">Musica</a></li>
            <li><a href="viaggi.html">Viaggi</a></li>
            <li><a href="arte.html">Arte</a></li>
            <li><a href="podcast.html">Podcast</a></li>
            <li><a href="chi-sono.html">Chi sono</a></li>
        </ul>
    </nav>

    <main class="page">
        <section class="category-grid" aria-label="Sezioni del sito">
            <a class="category" href="cinema.html"><h2>Cinema</h2></a>
            <a class="category" href="letteratura.html"><h2>Letteratura</h2></a>
            <a class="category" href="musica.html"><h2>Musica</h2></a>
            <a class="category" href="viaggi.html"><h2>Viaggi</h2></a>
            <a class="category" href="arte.html"><h2>Arte</h2></a>
            <a class="category" href="podcast.html"><h2>Podcast</h2></a>
            <a class="category" href="chi-sono.html"><h2>Chi sono</h2></a>
        </section>
    </main>

    <script>
        const menuButton = document.querySelector('.menu-button');
        const menuPanel = document.querySelector('#menu-panel');

        menuButton.addEventListener('click', () => {
            const isOpen = menuButton.classList.toggle('is-open');
            menuPanel.classList.toggle('is-open', isOpen);
            menuButton.setAttribute('aria-expanded', isOpen);
            menuButton.setAttribute('aria-label', isOpen ? 'Chiudi il menu' : 'Apri il menu');
        });
    </script>
</body>
</html>
