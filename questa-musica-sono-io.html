<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questa musica sono io</title>
    <style>
        :root { --sand: #cbb58f; --black: #080808; --brown: #4c3525; --card: rgba(255,255,255,.12); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; padding: 48px 24px 72px; background: var(--sand); color: var(--black); font-family: Arial, Helvetica, sans-serif; }
        .page { width: min(100%, 1100px); margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 46px; color: var(--black); font-weight: bold; text-decoration: none; }
        .back-link:hover { color: var(--brown); }
        h1 { margin-bottom: 14px; font-size: clamp(2.2rem, 5vw, 4.5rem); line-height: 1; text-transform: uppercase; }
        .intro { margin-bottom: 34px; font-size: 1.1rem; }
        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; list-style: none; }
        .photo-card { border: 3px solid var(--black); background: var(--card); }
        .photo-card img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: rgba(76,53,37,.22); }
        .photo-card figcaption { padding: 15px; font-weight: bold; line-height: 1.3; }
        .photo-card:not(:has(img[src])) img { visibility: hidden; }
        a:focus-visible { outline: 4px solid white; outline-offset: 5px; }
        @media (max-width: 760px) { .photo-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { body { padding: 28px 16px 48px; } .back-link { margin-bottom: 34px; } .photo-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main class="page">
        <a class="back-link" href="music.html">← Torna a Musica</a>
        <h1>Questa musica sono io</h1>
        <p class="intro">Qui puoi aggiungere le immagini e i ricordi musicali che ti rappresentano.</p>
        <ul class="photo-grid">
            <!-- Duplica una card per aggiungere altre immagini. Carica prima il file nella cartella images/. -->
            <li class="photo-card"><figure><img src="images/musica-01.jpg" alt="Descrizione dell'immagine 1"><figcaption>Inserisci qui una didascalia</figcaption></figure></li>
            <li class="photo-card"><figure><img src="images/musica-02.jpg" alt="Descrizione dell'immagine 2"><figcaption>Inserisci qui una didascalia</figcaption></figure></li>
            <li class="photo-card"><figure><img src="images/musica-03.jpg" alt="Descrizione dell'immagine 3"><figcaption>Inserisci qui una didascalia</figcaption></figure></li>
        </ul>
    </main>
</body>
</html>
