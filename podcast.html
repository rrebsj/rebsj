<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast | Il mio sito</title>
  <link rel="stylesheet" href="menu.css">
  <style>
    :root { --sand: #cbb58f; --black: #080808; --brown: #4c351f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; padding: 48px 24px 72px; background: var(--sand); color: var(--black); font-family: Arial, Helvetica, sans-serif; }
    .page { width: min(100%, 980px); margin: 0 auto; }
    .back-link { display: inline-block; margin-bottom: 52px; color: var(--black); font-weight: bold; text-decoration: none; }
    .back-link:hover { color: var(--brown); }
    h1 { margin-bottom: 12px; font-size: clamp(2.3rem, 6vw, 4.5rem); line-height: 1; text-transform: uppercase; }
    .rating-notes { margin-bottom: 40px; font-size: 1.15rem; font-weight: bold; }
    .podcast-list { display: grid; gap: 14px; list-style: none; }
    .podcast-list li { border: 3px solid var(--black); background: rgba(255,255,255,.12); }
    .podcast-trigger { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border: 0; background: transparent; color: inherit; font: inherit; font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.45; text-align: left; cursor: pointer; }
    .podcast-trigger:hover { background: rgba(255,255,255,.2); }
    .stars { flex-shrink: 0; white-space: nowrap; }
    a:focus-visible, button:focus-visible { outline: 4px solid white; outline-offset: 5px; }
    .podcast-dialog { width: min(calc(100% - 32px), 620px); max-width: 620px; margin: auto; padding: 28px; border: 3px solid var(--black); background: var(--sand); color: var(--black); }
    .podcast-dialog::backdrop { background: rgba(0,0,0,.65); }
    .podcast-dialog h2 { margin: 0 0 18px; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.2; }
    #dialog-description { line-height: 1.6; white-space: pre-wrap; }
    .dialog-close { display: block; margin: 22px 0 0 auto; padding: 8px 14px; border: 2px solid var(--black); background: transparent; color: inherit; font: inherit; font-weight: bold; cursor: pointer; }
    .dialog-close:hover { background: rgba(255,255,255,.3); }
    @media (max-width: 600px) {
      body { padding: 28px 16px 48px; }
      .back-link { margin-bottom: 38px; }
      .podcast-trigger { padding: 15px; }
      .podcast-dialog { padding: 22px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="index.html">↩ Torna alla home</a>
    <h1>Podcast ascoltati / in ascolto in ordine alfabetico</h1>
    <p class="rating-notes">VOTI IN 4/4</p>
    <ul class="podcast-list">
      <li><button class="podcast-trigger" type="button">Apnea - Carlo Lucarelli, RaiPlay / RaiPlay Sound <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Basaglia e i suoi - Massimo Cirri e Matteo Caccia, Il Post <span class="stars">⭐⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Camposanto - Giulia Depentor <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Ci vuole una scienza - Emanuele Mainetti, Beatrice Mautino, Il Post <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Dee Giallo - Carlo Lucarelli, One Podcast, Radio Dee Jay <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">DOI, Denominazione di origine inventata - Alberto Grandi e Daniele Soffiatì, One Podcast <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Dove nessuno guarda, il caso Elisa Claps - Pablo Trincia, Chora Media, Sky e Sky TG24 <span class="stars">⭐⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">E poi il silenzio, il disastro di Rigopiano - Pablo Trincia, Chora Media, Sky e Sky TG24 <span class="stars">⭐⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Generazione - Alessandra Pellegrini De Luca, Il Post <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Giallo in Castello - Carlo Lucarelli, Regione Emilia-Romagna, fondi FSE <span class="stars">⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">I bambini di Dio - Carmine Gazzani e Flavia Piccinini, One Podcast <span class="stars">⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Il banchiere di Dio - Nicolò Magnoni, Vois <span class="stars">⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Il cono d'ombra, La storia di Denis Bergamini - Pablo Trincia, Sky, Sky TG24 <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Il dito di Dio - Pablo Trincia, Spotify Studios <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">In compagnia del lupo, il cuore nero delle fiabe - Carlo Lucarelli, Sky Arte <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Indagini - Stefano Nazzi, Il Post <span class="stars">⭐⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">L'invasione - Luca Misculin, Riccardo Ginevra, Il Post <span class="stars">⭐⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Le ombre di via Poma, Simonetta Cesaroni un caso ancora aperto - Huffington Post <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Mariuoli - Andrea Aimar e Emanuele Monterotti <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Maschi - Francesco Pacifico, Il Post <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Megalopolis, Mumbai 2050 - Pablo Trincia, Spotify Studios <span class="stars">⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Meraviglia - Jacopo Veneziani, Intesa Sanpaolo e Chora Media <span class="stars">⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Musica Leggissima - Valerio Lundini, Chora e Sugar Play <span class="stars">⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Paolo Conte, il maestro è nell'anima - Giulia Cavalieri, Sugar Play, Chora Media <span class="stars">⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Piacere mio, La storia del sesso - Federica Cacciola, One Podcast <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Profondo nero - Carlo Lucarelli, Vois, Sky Crime, Crime Investigation <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Sangue loro, il ragazzo mandato a uccidere - Pablo Trincia, Chora Media, Sky e Sky TG24 <span class="stars">⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Tredici - Luigi Mastrodonato, Il Post <span class="stars">⭐⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Ultra Calvino - Ester Viola, Chora Media <span class="stars">⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Un avvertimento prima di iniziare - Pablo Trincia, Sky Original <span class="stars">⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">V come Vajont - Marco Paolini, Chora Media <span class="stars">⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Veleno - Pablo Trincia, One Podcast, La Repubblica <span class="stars">⭐⭐⭐⭐</span></button></li>
      <li><button class="podcast-trigger" type="button">Wilson - Francesco Costa, Il Post <span class="stars">⭐⭐⭐</span></button></li>
    </ul>
  </main>

  <dialog class="podcast-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2>
    <p id="dialog-description"></p>
    <button class="dialog-close" type="button">Chiudi</button>
  </dialog>

  <script>
    // Aggiungi qui le descrizioni: "Titolo esatto del podcast": "Descrizione".
    // Sono contenuti statici del sito e vengono mostrati in sola lettura.
    const podcastDescriptions = {};
    const podcastDialog = document.querySelector('.podcast-dialog');
    const dialogTitle = document.querySelector('#dialog-title');
    const dialogDescription = document.querySelector('#dialog-description');

    document.querySelectorAll('.podcast-trigger').forEach((button) => {
      button.addEventListener('click', () => {
        const title = button.firstChild.textContent.trim();
        dialogTitle.textContent = title;
        dialogDescription.textContent = podcastDescriptions[title] || 'Descrizione non ancora disponibile.';
        podcastDialog.showModal();
      });
    });

    document.querySelector('.dialog-close').addEventListener('click', () => podcastDialog.close());
    podcastDialog.addEventListener('click', (event) => {
      if (event.target === podcastDialog) podcastDialog.close();
    });
  </script>
  <script src="menu.js"></script>
</body>
</html>
